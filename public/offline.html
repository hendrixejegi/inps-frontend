<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - INPS School Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      object-fit: contain;
    }
    
    h1 {
      color: #0f172a;
      font-size: 24px;
      margin-bottom: 12px;
    }
    
    p {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background: #1d4ed8;
    }
    
    button:active {
      background: #1e40af;
    }
    
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fef3c7;
      color: #92400e;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <img src="/logo-icon.png" alt="INPS Logo" class="logo" />
    <h1>You're Offline</h1>
    <div class="status">No Internet Connection</div>
    <p>Check your internet connection and try again. Some features may not be available while offline.</p>
    <button onclick="window.location.reload()">Reload Page</button>
  </div>
</body>
</html>
